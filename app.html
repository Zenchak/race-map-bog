<script>
(()=>{
const local='/legacy/index.html';
const backup='https://6a9fda04e5e971aba29f9a03--illustrious-cupcake-c1bcb0.netlify.app/';
const frame=document.getElementById('raceFrame');
const label=document.getElementById('sourceLabel');
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
const MONTHS={gennaio:0,gen:0,febbraio:1,feb:1,marzo:2,mar:2,aprile:3,apr:3,maggio:4,mag:4,giugno:5,giu:5,luglio:6,lug:6,agosto:7,ago:7,settembre:8,set:8,ottobre:9,ott:9,novembre:10,nov:10,dicembre:11,dic:11};
function datesInText(text){const out=[],s=norm(text).toLowerCase();let m;const iso=/\b(20\d{2})[-/.](0?[1-9]|1[0-2])[-/.](0?[1-9]|[12]\d|3[01])\b/g;while((m=iso.exec(s)))out.push(new Date(+m[1],+m[2]-1,+m[3]));const ita=/\b(0?[1-9]|[12]\d|3[01])[\/.\-](0?[1-9]|1[0-2])[\/.\-](20\d{2})\b/g;while((m=ita.exec(s)))out.push(new Date(+m[3],+m[2]-1,+m[1]));const names=/\b(0?[1-9]|[12]\d|3[01])\s+(gen(?:naio)?|feb(?:braio)?|mar(?:zo)?|apr(?:ile)?|mag(?:gio)?|giu(?:gno)?|lug(?:lio)?|ago(?:sto)?|set(?:tembre)?|ott(?:obre)?|nov(?:embre)?|dic(?:embre)?)\s+(20\d{2})\b/g;while((m=names.exec(s))){const mo=MONTHS[m[2]];if(mo!==undefined)out.push(new Date(+m[3],mo,+m[1]))}return out.filter(d=>!Number.isNaN(d.getTime()))}
function isPast(text){const ds=datesInText(text);if(!ds.length)return false;const today=new Date();today.setHours(0,0,0,0);return Math.max(...ds.map(d=>{d.setHours(0,0,0,0);return d.getTime()}))<today.getTime()}
function addStyles(doc){
  if(doc.getElementById('bogdan-app-style'))return;
  const st=doc.createElement('style');
  st.id='bogdan-app-style';
  st.textContent=`
    .bogdan-past-race{display:none!important}
    .leaflet-control-layers,.leaflet-control.legend,.map-legend,.legend,[class*="map-legend"],[class*="mapLegend"]{display:none!important}
    .bogdan-detail-link{
      display:inline-flex;align-items:center;justify-content:center;gap:5px;
      margin-top:10px;padding:8px 11px;border-radius:10px;
      background:#eef5fb;border:1px solid #cfdeea;color:#174d78!important;
      text-decoration:none!important;font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif
    }
    .bogdan-detail-link:hover{background:#e4f0f8}
  `;
  doc.head.appendChild(st);
}
function raceHost(el){let h=el.closest('article,li,tr,.card,[class*="card"],[class*="item"],[class*="entry"]');if(h)return h;let p=el;for(let i=0;i<6&&p;i++,p=p.parentElement){const tx=norm(p.innerText||p.textContent);if(datesInText(tx).length&&tx.length>20&&tx.length<2500)return p}return el.parentElement}

const PRIMARY_RACE_FILTERS=[
  {key:'sprint',label:'Sprint'},
  {key:'olimpico',label:'Olimpico'},
  {key:'70.3',label:'70.3'},
  {key:'mezza',label:'Mezza maratona'},
  {key:'maratona',label:'Maratona'}
];
const OTHER_RACE_FILTERS=[
  {key:'full',label:'Full Ironman'},
  {key:'trail',label:'Trail'},
  {key:'10k',label:'10 km'},
  {key:'duathlon',label:'Duathlon'},
  {key:'ciclismo',label:'Ciclismo'},
  {key:'nuoto',label:'Nuoto'},
  {key:'aquathlon',label:'Aquathlon'}
];
const activeRaceTypes=new Set();

function raceTypesFor(text){
  const s=norm(text).toLowerCase(),out=new Set();
  const isTri=/(?:\btriathlon\b|\bironman\b|70[.,]3|\bolimpic[oa]\b|\bolympic\b|\bsprint\b|middle\s*distance|triathlon\s+medio|medio\s+triathlon)/i.test(s);

  if(/\b(?:super\s*)?sprint\b/i.test(s))out.add('sprint');
  if(/\b(?:olimpic[oa]|olympic)\b/i.test(s))out.add('olimpico');
  if(/(?:70[.,]3|half\s*ironman|ironman\s*70|middle\s*distance|triathlon\s+medio|medio\s+triathlon)/i.test(s))out.add('70.3');
  if(/(?:ironman\s*full|full\s*ironman|full[-\s]*distance|140[.,]6|3[.,]8\s*(?:km)?\s*[\/·-]\s*180\s*(?:km)?\s*[\/·-]\s*42(?:[.,]\d+)?)/i.test(s))out.add('full');

  if(!isTri){
    const halfMar=/(?:mezza\s+maratona|half\s+marathon|\b21(?:[.,]\d+)?\s*km\b)/i.test(s);
    const noHalf=s.replace(/mezza\s+maratona/gi,'').replace(/half\s+marathon/gi,'');
    const marathon=/(?:\bmaratona\b|\bmarathon\b|\b42(?:[.,]\d+)?\s*km\b)/i.test(noHalf);
    if(halfMar)out.add('mezza');
    if(marathon)out.add('maratona');
  }

  if(/(?:\btrail\b|ultra\s*trail|skyrace|sky\s*race|vertical\s*(?:km|race)?)/i.test(s))out.add('trail');
  if(!isTri && /(?:\b10(?:[.,]\d+)?\s*km\b|\b10k\b)/i.test(s))out.add('10k');
  if(/\bduathlon\b/i.test(s))out.add('duathlon');
  if(/(?:\bciclismo\b|\bcycling\b|\bgranfondo\b|\bgran\s*fondo\b|\bcriterium\b|\bciclotur)/i.test(s))out.add('ciclismo');
  if(/(?:\bnuoto\b|\bswim(?:ming)?\b|open\s*water)/i.test(s))out.add('nuoto');
  if(/\baquathlon\b/i.test(s))out.add('aquathlon');

  if(!out.size)out.add('altro');
  return out;
}

function findSportSelect(doc){
  for(const sel of doc.querySelectorAll('select')){
    const meta=norm([sel.id,sel.name,sel.getAttribute('aria-label'),sel.getAttribute('title')].filter(Boolean).join(' ')).toLowerCase();
    const opts=norm(Array.from(sel.options||[]).map(o=>o.textContent).join(' ')).toLowerCase();
    if(/\bsport\b/.test(meta))return sel;
    const hits=['triathlon','trail','corsa','running','nuoto','ciclismo','duathlon'].filter(x=>opts.includes(x)).length;
    if(hits>=2)return sel;
  }
  return null;
}

      .bogdan-race-chip{width:100%;min-width:0;min-height:38px;padding:5px 3px;font-size:9.5px;border-radius:9px}
      .bogdan-race-other{display:none!important;margin-top:6px;padding-top:6px}

function updateRaceFilterUI(doc){
  const panel=doc.getElementById('bogdan-race-type-filters');
  if(!panel)return;
  for(const b of panel.querySelectorAll('[data-race-filter]'))b.setAttribute('aria-pressed',activeRaceTypes.has(b.dataset.raceFilter)?'true':'false');
  const note=panel.querySelector('.bogdan-race-filter-note');
  if(note)note.textContent=activeRaceTypes.size?'Filtri combinati attivi · tocca di nuovo per rimuoverli':'Nessuna selezione: mostro tutte le gare';
}

function raceCandidates(doc){
  const found=new Set();

  for(const el of doc.querySelectorAll('time,[class*="date"],span,p,div,td')){
    if(el.closest&&el.closest('#bogdan-race-type-filters,.leaflet-container,.leaflet-popup'))continue;
    const own=norm(el.innerText||el.textContent);
    if(own.length>180||!datesInText(own).length)continue;

    let p=el,best=null;
    for(let i=0;i<7&&p;i++,p=p.parentElement){
      if(p.id==='bogdan-race-type-filters'||p.closest?.('.leaflet-container,.leaflet-popup'))break;
      const tx=norm(p.innerText||p.textContent);
      if(tx.length<8||tx.length>2200||!datesInText(tx).length)continue;
      const hasIdentity=!!p.querySelector?.('h2,h3,h4,strong,a,[class*="title"],[class*="name"]');
      if(hasIdentity){best=p;break}
      if(!best&&tx.length<700)best=p;
    }
    if(best)found.add(best);
  }

  doc.querySelectorAll('.bogdan-extra-card').forEach(x=>found.add(x));

  const arr=[...found];
  return arr.filter(x=>!arr.some(y=>y!==x&&x.contains(y)));
}

function matchesActiveRaceTypes(text){
  if(!activeRaceTypes.size)return true;
  const types=raceTypesFor(text);
  return [...activeRaceTypes].some(k=>types.has(k));
}

function baseFilterState(doc){
  const selects=[...doc.querySelectorAll('select')];
  let year=null,month=null;

  for(const sel of selects){
    const meta=norm([sel.id,sel.name,sel.getAttribute('aria-label'),sel.getAttribute('title'),sel.previousElementSibling?.textContent].filter(Boolean).join(' ')).toLowerCase();
    const val=String(sel.value||'').trim();
    const label=norm(sel.options?.[sel.selectedIndex]?.textContent||val).toLowerCase();
    const opts=norm(Array.from(sel.options||[]).map(o=>o.textContent).join(' ')).toLowerCase();

    if(year===null && (/\banno\b/.test(meta) || /\b2026\b/.test(opts)) && /^20\d{2}$/.test(val||label)) year=Number(val||label);

    if(month===null && (/\bmese\b/.test(meta) || /gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre/.test(opts))){
      if(/^\d{1,2}$/.test(val)){
        const n=Number(val);
        month=(n>=1&&n<=12)?n-1:null;
      }else if(label && !/tutti|all/.test(label)){
        const k=Object.keys(MONTHS).find(x=>label.startsWith(x));
        if(k)month=MONTHS[k];
      }
    }
  }

  const search=[...doc.querySelectorAll('input')].find(i=>{
    const meta=norm([i.id,i.name,i.placeholder,i.getAttribute('aria-label'),i.getAttribute('title')].filter(Boolean).join(' ')).toLowerCase();
    return /cerca|search|gara|localit/.test(meta);
  });
  return {q:norm(search?.value||'').toLowerCase(),year,month};
}

function matchesBaseFilters(text,state){
  const tx=norm(text),low=tx.toLowerCase();
  if(state.q && !low.includes(state.q))return false;
  const ds=datesInText(tx);
  if(state.year!==null && (!ds.length || !ds.some(d=>d.getFullYear()===state.year)))return false;
  if(state.month!==null && (!ds.length || !ds.some(d=>d.getMonth()===state.month)))return false;
  return true;
}

function updateVisibleCount(doc,visible){
  for(const el of doc.querySelectorAll('div,span,p')){
    const tx=norm(el.textContent);
    if(/^\d+\s+eventi?$/i.test(tx)){
      el.textContent=visible+' '+(visible===1?'evento':'eventi');
      break;
    }
  }
}

function leafletText(layer){
  const parts=[];
  try{
    const popup=layer.getPopup?.()||layer._popup;
    let v=popup?.getContent?.() ?? popup?._content;
    if(typeof v==='function')v=v(layer);
    if(v&&v.nodeType)parts.push(v.innerText||v.textContent||'');
    else if(v!=null)parts.push(String(v));
  }catch{}
  try{
    const tip=layer.getTooltip?.()||layer._tooltip;
    let v=tip?.getContent?.() ?? tip?._content;
    if(v&&v.nodeType)parts.push(v.innerText||v.textContent||'');
    else if(v!=null)parts.push(String(v));
  }catch{}
  try{
    const o=layer.options||{};
    ['title','alt','name','label','type','discipline','distance','category'].forEach(k=>{if(o[k]!=null)parts.push(String(o[k]))});
  }catch{}
  return norm(parts.join(' '));
}

function findLeafletMaps(win){
  const maps=[];
  try{
    for(const k of Object.keys(win)){
      let v;
      try{v=win[k]}catch{continue}
      if(!v||typeof v!=='object')continue;
      if(typeof v.eachLayer==='function'&&typeof v.addLayer==='function'&&typeof v.removeLayer==='function'&&typeof v.getCenter==='function'){
        maps.push(v);
      }
    }
  }catch{}
  return [...new Set(maps)];
}

function collectLeafletMarkers(win){
  if(win.__bogdanRaceMarkers?.length)return win.__bogdanRaceMarkers;
  const entries=[];
  const seen=new Set();

  function walk(layer,parent,map){
    if(!layer||seen.has(layer))return;
    seen.add(layer);

    let children=null;
    try{
      if(typeof layer.getLayers==='function')children=layer.getLayers();
    }catch{}
    if(Array.isArray(children)&&children.length){
      for(const child of children)walk(child,layer,map);
      return;
    }

    if(typeof layer.getLatLng==='function'){
      entries.push({layer,parent:parent||map,map,text:leafletText(layer),visible:true});
    }
  }

  for(const map of findLeafletMaps(win)){
    try{map.eachLayer(layer=>walk(layer,null,map))}catch{}
  }

  win.__bogdanRaceMarkers=entries;
  return entries;
}

function applyLeafletFilters(doc,state){
  const win=doc.defaultView;
  if(!win)return;
  const entries=collectLeafletMarkers(win);
  if(!entries.length)return;

  for(const e of entries){
    if(!e.text)e.text=leafletText(e.layer);
    const show=!!e.text && matchesBaseFilters(e.text,state) && matchesActiveRaceTypes(e.text);

    if(show&&!e.visible){
      try{e.parent.addLayer(e.layer);e.visible=true}catch{}
    }else if(!show&&e.visible){
      try{e.parent.removeLayer(e.layer);e.visible=false}catch{}
    }
  }
}

function applyRaceFilters(doc){
  let visible=0;
  const cards=raceCandidates(doc);
  const state=baseFilterState(doc);

  for(const h of cards){
    const tx=norm(h.innerText||h.textContent);
    const show=matchesBaseFilters(tx,state) && matchesActiveRaceTypes(tx);
    h.classList.toggle('bogdan-type-hidden',!show);
    if(show&&!h.classList.contains('bogdan-past-race'))visible++;
  }

  updateVisibleCount(doc,visible);
  applyLeafletFilters(doc,state);
  updateRaceFilterUI(doc);
}
function filterHostFor(doc,legacy){
  if(!legacy)return doc.querySelector('main')||doc.body;
  let p=legacy.parentElement;
  for(let i=0;i<7&&p;i++,p=p.parentElement){
    const selects=p.querySelectorAll('select').length;
    const inputs=p.querySelectorAll('input').length;
    if(selects>=3 || (selects>=2&&inputs>=1))return p;
  }
  return legacy.parentElement?.parentElement||legacy.parentElement||doc.querySelector('main')||doc.body;
}
function sportFieldFor(legacy){
  let p=legacy?.parentElement;
  for(let i=0;i<4&&p;i++,p=p.parentElement){
    if(p.querySelectorAll('select').length===1 && norm(p.innerText||p.textContent).length<160)return p;
  }
  return legacy?.parentElement||null;
}

function ensureTypeFilters(doc){
  const existing=doc.getElementById('bogdan-race-type-filters');
  if(existing){updateRaceFilterUI(doc);return}
  addRaceFilterStyles(doc);

  const legacy=findSportSelect(doc);
  const filterHost=filterHostFor(doc,legacy);

  if(legacy){
    const field=sportFieldFor(legacy);
    if(field && field!==filterHost) field.style.display='none';
    else legacy.style.display='none';

    legacy.setAttribute('aria-hidden','true');
    if(legacy.id){
      const lab=doc.querySelector('label[for="'+legacy.id.replace(/"/g,'\\\"')+'"]');
      if(lab && lab!==filterHost) lab.style.display='none';
    }

    try{
      const display=doc.defaultView.getComputedStyle(filterHost).display;
      if(display.includes('flex')) filterHost.style.flexWrap='wrap';
    }catch{}
  }

  const panel=doc.createElement('section');
  panel.id='bogdan-race-type-filters';
  panel.className='bogdan-race-filter';
  panel.innerHTML='<div class="bogdan-race-filter-title">Formato gara</div><div class="bogdan-race-filter-row bogdan-race-main"></div><div class="bogdan-race-filter-row bogdan-race-other"></div><div class="bogdan-race-filter-note">Nessuna selezione: mostro tutte le gare</div>';

  const main=panel.querySelector('.bogdan-race-main');
  const other=panel.querySelector('.bogdan-race-other');
  other.classList.remove('is-open');
  const makeChip=(x,parent)=>{
    const b=doc.createElement('button');
    b.type='button';
    b.className='bogdan-race-chip';
    b.dataset.raceFilter=x.key;
    b.textContent=x.label;
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{
      activeRaceTypes.has(x.key)?activeRaceTypes.delete(x.key):activeRaceTypes.add(x.key);
      applyRaceFilters(doc);
    });
    parent.appendChild(b);
  };

  PRIMARY_RACE_FILTERS.forEach(x=>makeChip(x,main));

  const more=doc.createElement('button');
  more.type='button';
  more.className='bogdan-race-chip bogdan-race-more';
  more.textContent='Altri ▾';
  more.setAttribute('aria-expanded','false');
  more.addEventListener('click',()=>{
    const open=!other.classList.contains('is-open');
    other.classList.toggle('is-open',open);
    more.setAttribute('aria-expanded',open?'true':'false');
    more.textContent=open?'Altri ▴':'Altri ▾';
  });
  main.appendChild(more);

  OTHER_RACE_FILTERS.forEach(x=>makeChip(x,other));

  // Mantieni sincronizzati anche ricerca/anno/mese del contenuto legacy.
  for(const el of filterHost.querySelectorAll('input,select')){
    if(el.closest('#bogdan-race-type-filters')||el.dataset.bogdanFilterHooked==='1')continue;
    el.dataset.bogdanFilterHooked='1';
    const ev=el.tagName==='INPUT'?'input':'change';
    el.addEventListener(ev,()=>setTimeout(()=>applyRaceFilters(doc),100));
  }

  // Put the format filters in the same visible filter area as search/year/month.
  filterHost.appendChild(panel);
  applyRaceFilters(doc);
}

function raceTitleFor(host){
  const el=host.querySelector('h2,h3,h4,[class*="title"],strong');
  const title=norm(el?.innerText||el?.textContent||'');
  if(title && !/^calendario gare$/i.test(title))return title;
  const text=norm(host.innerText||host.textContent);
  return text.split(/\b(?:20\d{2}|\d{1,2}[\/.\-]\d{1,2}[\/.\-]20\d{2})\b/)[0].trim().slice(0,140);
}
function ensureRaceDetailLinks(doc){
  for(const host of raceCandidates(doc)){
    if(host.closest('.leaflet-container,.leaflet-popup'))continue;
    if(host.querySelector('.bogdan-detail-link'))continue;
    if(host.classList.contains('bogdan-extra-card') || host.querySelector('.bogdan-extra-actions'))continue;

    const links=[...host.querySelectorAll('a[href]')].filter(a=>{
      const href=a.getAttribute('href')||'';
      return href && !href.startsWith('#') && !/^javascript:/i.test(href) && !/google\.[^/]+\/maps|maps\.google/i.test(href);
    });
    let href=links[0]?.href||'';
    const title=raceTitleFor(host)||'gara sportiva';
    if(!href)href='https://www.google.com/search?q='+encodeURIComponent(title);

    const a=doc.createElement('a');
    a.className='bogdan-detail-link';
    a.href=href;
    a.target='_blank';
    a.rel='noopener';
    a.textContent='Dettagli gara ↗';
    host.appendChild(a);
  }
}

function process(){try{
  const doc=frame.contentDocument;if(!doc||!doc.body)return;
  addStyles(doc);
  doc.querySelectorAll('.bogdan-feasibility').forEach(x=>x.remove());
  doc.querySelectorAll('.bogdan-rated-host').forEach(x=>x.classList.remove('bogdan-rated-host'));
  ensureTypeFilters(doc);

  // Nascondi le gare già passate.
  for(const el of doc.querySelectorAll('time,span,p,div,td')){
    const tx=norm(el.innerText||el.textContent);
    if(tx.length>180||!datesInText(tx).length||!isPast(tx))continue;
    const h=raceHost(el);
    if(h){
      const full=norm(h.innerText||h.textContent);
      if(isPast(full))h.classList.add('bogdan-past-race');
    }
  }

  for(const el of doc.querySelectorAll('.leaflet-popup-content,[class*="popup"]')){
    const text=norm(el.innerText||el.textContent);
    if(isPast(text)){const p=el.closest('.leaflet-popup')||el;p.style.display='none'}
  }

  ensureRaceDetailLinks(doc);
  applyRaceFilters(doc);
}catch(e){console.warn('Filtri gare non applicabili',e)}}
function activate(){process();try{const doc=frame.contentDocument;if(!doc||!doc.body)return;const obs=new MutationObserver(()=>{clearTimeout(window.__raceProcessTimer);window.__raceProcessTimer=setTimeout(process,120)});obs.observe(doc.body,{childList:true,subtree:true})}catch(e){}}
frame.addEventListener('load',()=>setTimeout(activate,150));fetch(local,{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);frame.src=local;label.textContent='Copia locale sul NAS · gare passate nascoste · filtri multipli attivi'}).catch(()=>{frame.src=backup;label.textContent='Backup Netlify · filtro avanzato non disponibile'});
})();
</script>
