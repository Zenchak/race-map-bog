<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Calendario Gare</title>
<style>
:root{--bar:#0d1c2d;--line:#25435f;--text:#f4f8fc;--accent:#67e8f9;--muted:#a8bdcf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff}
.nav{height:58px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#112b45,#081626);border-bottom:1px solid var(--line);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.2);position:relative;z-index:2}
.brand{min-width:0}.title{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.switch{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#06111d;background:linear-gradient(135deg,var(--accent),#8fb7ff);border-radius:11px;padding:10px 12px;font-size:12px;font-weight:850;box-shadow:0 5px 16px rgba(103,232,249,.2)}
iframe{display:block;width:100%;height:calc(100% - 58px);border:0;background:#fff}
@media(max-width:480px){.nav{height:54px;padding:7px 9px}.sub{display:none}.switch{padding:9px 11px}iframe{height:calc(100% - 54px)}}
</style>
</head>
<body>
  <div class="nav">
    <div class="brand"><div class="title">🗺️ Calendario Gare</div><div class="sub" id="sourceLabel">Carico la copia locale…</div></div>
    <a class="switch" id="trainingLink" href="https://training-dashboard-bog.netlify.app/">📊 Allenamenti</a>
  </div>
  <iframe id="raceFrame" title="Mappa delle gare"></iframe>
<script src="/feasibility.js"></script>
<script>
(()=>{
  const local='/legacy/index.html';
  const backup='https://6a9fda04e5e971aba29f9a03--illustrious-cupcake-c1bcb0.netlify.app/';
  const frame=document.getElementById('raceFrame');
  const label=document.getElementById('sourceLabel');
  if(location.port==='8082') document.getElementById('trainingLink').href=`${location.protocol}//${location.hostname}:8081/`;

  function normalize(s){return String(s||'').replace(/\s+/g,' ').trim()}
  function evaluationFor(text){
    const cfg=window.RACE_FEASIBILITY||{};
    const clean=normalize(text);
    for(const x of (cfg.overrides||[])){
      const hit=x.match instanceof RegExp ? x.match.test(clean) : clean.toLowerCase().includes(String(x.match||'').toLowerCase());
      if(hit)return x;
    }
    for(const r of (cfg.rules||[])) if(r.test&&r.test.test(clean)) return r;
    return null;
  }

  function addRatingStyles(doc){
    if(doc.getElementById('bogdan-feasibility-style'))return;
    const st=doc.createElement('style');st.id='bogdan-feasibility-style';st.textContent=`
      .bogdan-feasibility{margin:9px 0 4px;padding:9px 10px;border-radius:12px;background:#f6f8fb;border:1px solid #dce4ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.35}
      .bogdan-feasibility-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:800;color:#172536}
      .bogdan-feasibility-score{margin-left:auto;font-size:11px;color:#5f6f80;font-weight:800}
      .bogdan-feasibility-detail{font-size:11px;color:#536474;margin-top:4px}
      .bogdan-feasibility-note{font-size:9px;color:#8593a2;margin-top:5px}
      @media(max-width:600px){.bogdan-feasibility{padding:8px}.bogdan-feasibility-detail{font-size:10px}.bogdan-feasibility-score{margin-left:0}}
    `;doc.head.appendChild(st)
  }

  function decorateHost(doc,host,e){
    if(!host||host.classList.contains('bogdan-rated-host')||host.closest('.bogdan-rated-host'))return;
    host.classList.add('bogdan-rated-host');
    const box=doc.createElement('div');box.className='bogdan-feasibility';
    const head=doc.createElement('div');head.className='bogdan-feasibility-head';
    const status=doc.createElement('span');status.textContent=`${e.badge||'⚪'} ${e.level||'Da valutare'}`;
    const score=doc.createElement('span');score.className='bogdan-feasibility-score';score.textContent=`Fattibilità per te: ${e.score??'—'}/100`;
    const detail=doc.createElement('div');detail.className='bogdan-feasibility-detail';detail.textContent=e.detail||'';
    const note=doc.createElement('div');note.className='bogdan-feasibility-note';note.textContent='Valutazione ChatGPT basata sulla preparazione e sugli allenamenti registrati.';
    head.append(status,score);box.append(head,detail,note);host.appendChild(box)
  }

  function decorateRaces(){
    try{
      const doc=frame.contentDocument;if(!doc||!doc.body)return;
      addRatingStyles(doc);
      const titleEls=[...doc.querySelectorAll('h2,h3,h4,strong,[class*="title"],a')];
      const seen=new Set();
      for(const t of titleEls){
        const host=t.closest('article,li,tr,.card,[class*="card"],[class*="race"],[class*="event"]')||t.parentElement;
        if(!host||seen.has(host))continue;
        seen.add(host);
        const text=normalize(host.innerText||host.textContent);
        if(text.length<8||text.length>3000)continue;
        const ev=evaluationFor(text);if(ev)addRatingStyles(doc),decorateHost(doc,host,ev);
      }
    }catch(err){console.warn('Valutazioni gare non applicabili',err)}
  }

  function activateRatings(){
    decorateRaces();
    try{
      const doc=frame.contentDocument;if(!doc||!doc.body)return;
      const obs=new MutationObserver(()=>{clearTimeout(window.__raceRatingTimer);window.__raceRatingTimer=setTimeout(decorateRaces,120)});
      obs.observe(doc.body,{childList:true,subtree:true});
    }catch(e){}
  }

  frame.addEventListener('load',()=>setTimeout(activateRatings,150));
  fetch(local,{method:'HEAD',cache:'no-store'}).then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);
    frame.src=local;
    label.textContent='Copia locale sul NAS · valutazione personale attiva';
  }).catch(()=>{
    frame.src=backup;
    label.textContent='Backup Netlify · valutazione non disponibile';
  });
})();
</script>
</body>
</html>
