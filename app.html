<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Calendario Gare</title>
<style>
:root{--bar:#0d1c2d;--line:#25435f;--text:#f4f8fc;--muted:#a8bdcf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff}
.nav{height:58px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#112b45,#081626);border-bottom:1px solid var(--line);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.2);position:relative;z-index:2}
.brand{min-width:0}.title{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.refresh{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 11px;font:800 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;cursor:pointer;white-space:nowrap}
iframe{display:block;width:100%;height:calc(100% - 58px);border:0;background:#fff}
@media(max-width:480px){.nav{height:54px;padding:7px 9px}.title{font-size:16px}.sub{font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.refresh{padding:7px 9px;font-size:10px}iframe{height:calc(100% - 54px)}}
</style>
</head>
<body>
<div class="nav"><div class="brand"><div class="title">🗺️ Calendario Gare</div><div class="sub">HUB build 2026.10.13-0805 · lista diretta dal dataset</div></div><button class="refresh" type="button" onclick="document.getElementById('raceFrame').src='/legacy/index.html?hub='+Date.now()">↻ Refresh</button></div>
<iframe id="raceFrame" title="Mappa delle gare" src="/legacy/index.html?hub=202610130805"></iframe>
</body>
</html>
