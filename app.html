<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Calendario Gare</title>
<style>
:root{--bar:#0d1c2d;--line:#25435f;--text:#f4f8fc;--muted:#a8bdcf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff}
.nav{height:58px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#112b45,#081626);border-bottom:1px solid var(--line);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.2);position:relative;z-index:2}
.brand{min-width:0}.title{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.hub-actions{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border:1px solid #dbe2ee;border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 12px 32px rgba(16,24,40,.22);z-index:9999;white-space:nowrap}.hub-actions button,.hub-actions a{border:0;border-radius:17px;padding:12px 17px;font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-decoration:none;cursor:pointer}.hub-actions button{color:white;background:#7638f4}.hub-actions a{color:white;background:#ff9828}
iframe{display:block;width:100%;height:calc(100% - 58px);border:0;background:#fff}
@media(max-width:480px){.nav{height:54px;padding:7px 9px}.title{font-size:16px}.sub{font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.hub-actions button,.hub-actions a{padding:11px 15px;font-size:14px}iframe{height:calc(100% - 54px)}}
</style>
</head>
<body>
<div class="nav"><div class="brand"><div class="title">🗺️ Calendario Gare</div><div class="sub">HUB build 2026.10.13-0805 · lista diretta dal dataset</div></div></div>
<iframe id="raceFrame" title="Mappa delle gare" src="/legacy/index.html?hub=202610130805"></iframe>
<div class="hub-actions"><button type="button" onclick="document.getElementById('raceFrame').src='/legacy/index.html?hub='+Date.now()">⟳ Refresh</button><a href="/">⌂ Home</a></div>
<script>
(function(){
 const frame=document.getElementById('raceFrame');
 function adjust(){
  try{
   const d=frame.contentDocument;if(!d||!d.body)return;
   if(!d.getElementById('hub-race-cleanup')){
    const st=d.createElement('style');st.id='hub-race-cleanup';
    st.textContent='input[placeholder*="Gara o localit"],input[placeholder*="gara o localit"]{display:none!important}';
    d.head.appendChild(st);
   }
   const inputs=[...d.querySelectorAll('input')].filter(el=>/gara o localit/i.test(el.placeholder||''));
   inputs.forEach(el=>{
    let wrap=el.closest('label')||el.parentElement;
    for(let i=0;i<3&&wrap&&wrap.parentElement;i++){
      const txt=(wrap.textContent||'').trim();
      if(/^(cerca\s*)?$/i.test(txt)||wrap.querySelectorAll('input').length===1&&txt.length<25)wrap=wrap.parentElement;else break;
    }
    if(wrap&&wrap!==d.body&&wrap.querySelectorAll('input').length===1)wrap.style.display='none';
    else el.style.display='none';
   });
   [...d.querySelectorAll('a,button')].filter(el=>/^\s*(🏠\s*)?home\s*$/i.test(el.textContent||'')).forEach(el=>el.style.display='none');
  }catch(e){console.warn('Pulizia calendario non disponibile',e)}
 }
 frame.addEventListener('load',()=>{adjust();setTimeout(adjust,500);setTimeout(adjust,1600)});
})();
</script>
</body>
</html>
