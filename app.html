<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fd"><title>Calendario Gare · Zenchak Hub</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#101f50;background:#f7f9fd}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;padding:14px 14px 90px}header{display:flex;align-items:center;gap:12px;margin-bottom:14px}header a{text-decoration:none;color:#2467df;font-size:13px;font-weight:700}h1{font-size:23px;margin:8px 0 2px}p{margin:0;color:#8190aa;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#eaf0fa;border-radius:12px;padding:4px;margin:16px 0}.tabs button{border:0;background:transparent;border-radius:9px;padding:11px 5px;color:#50678d;font-weight:700}.tabs button.active{background:#2675e7;color:white;box-shadow:0 3px 10px #2675e733}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.filters label{font-size:10px;color:#63789d}.filters select,.filters input{display:block;width:100%;margin-top:4px;border:1px solid #e1e9f5;background:white;border-radius:9px;padding:10px 6px;color:#182a52;font-size:12px}.search{margin:10px 0;width:100%;border:1px solid #e1e9f5;border-radius:10px;padding:12px}.categories{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.categories button{flex:0 0 auto;border:0;background:#fff;border-radius:10px;padding:10px 12px;font-size:11px;color:#345078}.categories button.active{background:#2573e7;color:#fff}.month{font-size:15px;font-weight:850;margin:16px 2px 9px;display:flex;justify-content:space-between}.month small{font-size:11px;color:#8a99ae;font-weight:500}.race{width:100%;border:1px solid #e9eef7;background:#fff;border-radius:14px;padding:10px;margin:7px 0;display:flex;align-items:center;gap:10px;text-align:left;color:#10204f;cursor:pointer}.datebox{background:#edf4ff;border-radius:9px;min-width:46px;text-align:center;padding:5px}.datebox small{font-size:9px;color:#2870d9;font-weight:800}.datebox strong{font-size:22px;display:block}.raceinfo{min-width:0;flex:1}.raceinfo strong{font-size:13px;display:block}.raceinfo small{display:block;color:#8290a8;font-size:11px;margin-top:4px}.raceinfo em{display:inline-block;margin-top:5px;background:#fceaf1;color:#bd4269;border-radius:5px;padding:3px 6px;font-style:normal;font-size:10px}.arrow{font-size:22px;color:#8fa2bc}.hidden{display:none!important}#map{height:calc(100dvh - 165px);min-height:380px;border:0;width:100%;border-radius:14px}#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:72px;background:#fff;border:1px solid #e9edf5;border-radius:9px;padding:7px 4px;font-size:12px;cursor:pointer}.day b{display:block}.day span{display:block;margin-top:4px;color:#2372e3;font-size:10px;font-weight:800}.calendar-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px}.calendar-head button{border:0;background:#eaf1fc;border-radius:8px;padding:9px 15px}.weekday{text-align:center;color:#8c9bb2;font-size:11px}#detail{position:fixed;inset:0;background:#f7f9fd;z-index:10;overflow:auto;padding:18px max(18px,calc((100vw - 650px)/2)) 80px}#detail button.back{border:0;background:transparent;color:#2675e7;font-size:14px;padding:7px 0}#detail h2{font-size:27px;margin:20px 0 8px}.hero-detail{height:140px;background:linear-gradient(120deg,#dceafe,#f9e7eb);border-radius:18px;display:grid;place-items:center;font-size:60px}.badge{display:inline-block;border-radius:6px;background:#fce7ed;color:#bb3d61;font-size:11px;padding:6px 9px;margin:8px 0}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;background:white;border-radius:14px;padding:15px;margin:12px 0}.detail-grid div{font-size:12px;overflow-wrap:anywhere}.detail-grid small{display:block;color:#8c9bb2;margin-bottom:5px}.detail-links{display:flex;gap:9px;margin:14px 0}.detail-links a{flex:1;text-align:center;text-decoration:none;background:#2675e7;color:#fff;border-radius:10px;padding:12px;font-size:12px;font-weight:800}.detail-links a:nth-child(2){background:#e8f0ff;color:#2867c6}textarea{width:100%;border:1px solid #e4eaf4;border-radius:12px;padding:12px;min-height:90px;font:inherit}#empty{color:#8290a8;padding:30px;text-align:center}.foot{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}.foot a,.foot button{background:#fff;border:1px solid #e0e8f5;border-radius:25px;padding:9px 17px;box-shadow:0 4px 16px #14294a18;color:#245fbe;font-weight:800;text-decoration:none;font-size:12px}
</style></head><body><main class="app"><header><a href="/">‹ &nbsp; Zenchak Hub</a></header><h1>🏁 Calendario Gare</h1><p>Tutte le gare segnalate · mappa interattiva · filtri per anno, mese e disciplina</p><nav class="tabs"><button class="active" data-view="list">☷ &nbsp; Lista</button><button data-view="map">▣ &nbsp; Mappa</button><button data-view="calendar">▦ &nbsp; Calendario</button></nav><section id="list-view"><div class="filters"><label>Anno<select id="year"><option value="">Tutti</option></select></label><label>Mese<select id="month"><option value="">Tutti</option></select></label><label>Disciplina<select id="discipline"><option value="">Tutte</option></select></label></div><input class="search" id="search" placeholder="Cerca gara o località"><div class="categories" id="categories"></div><div id="races"></div><div id="empty" class="hidden">Nessuna gara con questi filtri.</div></section><section id="map-view" class="hidden"><iframe id="map" title="Mappa gare" loading="lazy" src="/legacy/index.html"></iframe></section><section id="calendar-view" class="hidden"><div id="calendar"></div></section></main><div id="detail" class="hidden"></div><div class="foot"><button onclick="location.reload()">↻ Refresh</button><a href="/">⌂ Home</a></div><script src="/legacy/extra-races.js"></script><script>
const races=(Array.isArray(window.EXTRA_RACES)?window.EXTRA_RACES:[]).filter(r=>/^20\d{2}-\d{2}-\d{2}$/.test(r.date||'')).sort((a,b)=>a.date.localeCompare(b.date));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}),mon=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
let category='Tutte',calMonth=new Date();const disciplines=[...new Set(races.map(r=>r.discipline).filter(Boolean))].sort();
for(const y of [...new Set(races.map(r=>r.date.slice(0,4)))].sort())$('year').add(new Option(y,y));
['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'].forEach((m,i)=>$('month').add(new Option(m,String(i+1))));
disciplines.forEach(x=>$('discipline').add(new Option(x,x)));
const cats=['Tutte','Triathlon','Running','Gravel','Ciclismo','Nuoto','Trail','Altro'];
function kind(r){const t=[r.name,r.discipline,r.distance].join(' ').toLowerCase();return /triathlon|ironman|70[.,]3/.test(t)?'Triathlon':/gravel/.test(t)?'Gravel':/ciclism|gran fondo|granfondo|cycling/.test(t)?'Ciclismo':/nuoto|swim/.test(t)?'Nuoto':/trail|sky race/.test(t)?'Trail':/running|maraton|10 km|21 km|42 km|podistic/.test(t)?'Running':'Altro'}
function categoryBar(){$('categories').innerHTML=cats.map(c=>'<button class="'+(category===c?'active':'')+'" data-cat="'+c+'">'+esc(c)+'</button>').join('');$('categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;categoryBar();render()})}
function filtered(){const now=new Date();now.setHours(0,0,0,0);return races.filter(r=>{const d=new Date(r.date+'T12:00:00');return d>=now&&(!$('year').value||r.date.startsWith($('year').value))&&(!$('month').value||Number(r.date.slice(5,7))===Number($('month').value))&&(!$('discipline').value||r.discipline===$('discipline').value)&&(category==='Tutte'||kind(r)===category)&&[r.name,r.location,r.distance,r.discipline].join(' ').toLowerCase().includes($('search').value.toLowerCase())})}
function render(){const a=filtered(),groups={};a.forEach(r=>(groups[mon(r.date)]??=[]).push(r));$('races').innerHTML=Object.entries(groups).map(([m,items])=>'<div class="month">'+esc(m)+'<small>'+items.length+' gare</small></div>'+items.map(r=>{const i=races.indexOf(r);return '<button class="race" data-id="'+i+'"><div class="datebox"><small>'+esc(new Date(r.date+'T12:00:00').toLocaleDateString('it-IT',{weekday:'short'}).toUpperCase())+'</small><strong>'+Number(r.date.slice(8))+'</strong></div><div class="raceinfo"><strong>'+esc(r.name)+'</strong><small>⌖ '+esc(r.location||'Località da verificare')+' · '+esc(r.distance||'')+'</small><em>'+esc(kind(r))+' · '+esc(r.discipline||'Gara')+'</em></div><span class="arrow">›</span></button>'}).join('')).join('');$('empty').classList.toggle('hidden',!!a.length);$('races').querySelectorAll('button').forEach(b=>b.onclick=()=>openRace(Number(b.dataset.id)))}
function openRace(i){const r=races[i];if(!r)return;const key='race-note-'+r.date+'-'+r.name;const notes=localStorage.getItem(key)||'';$('detail').innerHTML='<button class="back">‹ &nbsp; Calendario Gare</button><div class="hero-detail">🏃</div><h2>'+esc(r.name)+'</h2><p>⌖ '+esc(r.location||'Località da verificare')+'</p><span class="badge">'+esc(kind(r))+' · '+esc(r.discipline||'Gara')+'</span><div class="detail-grid"><div><small>Data</small>'+esc(fmt(r.date))+'</div><div><small>Stato iscrizioni</small>'+esc(r.status||'Da verificare')+'</div><div><small>Distanza</small>'+esc(r.distance||'Da verificare')+'</div><div><small>Tipologia</small>'+esc(r.discipline||kind(r))+'</div><div><small>Organizzazione</small>'+esc(r.organizer||'Da verificare')+'</div><div><small>Quota iscrizione</small>'+esc(r.price||'Da verificare')+'</div></div><div class="detail-links">'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">↗ Sito ufficiale</a>':'')+(r.mapUrl?'<a href="'+esc(r.mapUrl)+'" target="_blank" rel="noopener">▣ Mappa</a>':'')+'</div><h3>Note personali</h3><textarea id="note" placeholder="Aggiungi una nota...">'+esc(notes)+'</textarea>'+(r.note?'<p style="margin-top:12px">'+esc(r.note)+'</p>':'');$('detail').classList.remove('hidden');$('detail').querySelector('.back').onclick=()=>$('detail').classList.add('hidden');$('note').oninput=e=>localStorage.setItem(key,e.target.value);window.scrollTo(0,0)}
function renderCalendar(){const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),count=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let html='<div class="calendar-head"><button id="prev">‹</button><strong>'+esc(first.toLocaleDateString('it-IT',{month:'long',year:'numeric'}))+'</strong><button id="next">›</button></div>'+['L','M','M','G','V','S','D'].map(x=>'<div class="weekday">'+x+'</div>').join('');for(let i=0;i<offset;i++)html+='<div></div>';for(let day=1;day<=count;day++){const d=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),rr=races.filter(r=>r.date===d);html+='<button class="day" data-date="'+d+'"><b>'+day+'</b>'+(rr.length?'<span>'+rr.length+' gare</span>':'')+'</button>'}$('calendar').innerHTML=html;$('prev').onclick=()=>{calMonth=new Date(y,m-1,1);renderCalendar()};$('next').onclick=()=>{calMonth=new Date(y,m+1,1);renderCalendar()};$('calendar').querySelectorAll('.day').forEach(b=>b.onclick=()=>{const rr=races.filter(r=>r.date===b.dataset.date);if(rr.length===1)openRace(races.indexOf(rr[0]));else if(rr.length){document.querySelector('[data-view="list"]').click();$('year').value=String(y);$('month').value=String(m+1);render()}})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));for(const v of ['list','map','calendar'])$(v+'-view').classList.toggle('hidden',b.dataset.view!==v);if(b.dataset.view==='calendar')renderCalendar()});for(const id of ['year','month','discipline','search'])$(id).addEventListener(id==='search'?'input':'change',render);categoryBar();render();
</script></body></html>
