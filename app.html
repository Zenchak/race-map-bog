<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Calendario Gare</title>
<style>
:root{--bar:#0d1c2d;--line:#25435f;--text:#f4f8fc;--accent:#67e8f9;--muted:#a8bdcf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff}
.nav{height:58px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#112b45,#081626);border-bottom:1px solid var(--line);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.2);position:relative;z-index:2}
.brand{min-width:0}.title{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.switch{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#06111d;background:linear-gradient(135deg,var(--accent),#8fb7ff);border-radius:11px;padding:10px 12px;font-size:12px;font-weight:850;box-shadow:0 5px 16px rgba(103,232,249,.2)}
iframe{display:block;width:100%;height:calc(100% - 58px);border:0;background:#fff}
@media(max-width:480px){.nav{height:54px;padding:7px 9px}.sub{display:none}.switch{padding:9px 11px}iframe{height:calc(100% - 54px)}}
</style>
</head>
<body>
  <div class="nav">
    <div class="brand"><div class="title">🗺️ Calendario Gare</div><div class="sub" id="sourceLabel">Carico la copia locale…</div></div>
    <a class="switch" id="trainingLink" href="https://training-dashboard-bog.netlify.app/">📊 Allenamenti</a>
  </div>
  <iframe id="raceFrame" title="Mappa delle gare"></iframe>
<script>
(async()=>{
  const local='/legacy/index.html';
  const backup='https://6a9fda04e5e971aba29f9a03--illustrious-cupcake-c1bcb0.netlify.app/';
  const frame=document.getElementById('raceFrame');
  const label=document.getElementById('sourceLabel');
  if(location.port==='8082') document.getElementById('trainingLink').href=`${location.protocol}//${location.hostname}:8081/`;
  try{
    const r=await fetch(local,{method:'HEAD',cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    frame.src=local;
    label.textContent='Copia locale sul NAS';
  }catch(e){
    frame.src=backup;
    label.textContent='Backup Netlify';
  }
})();
</script>
</body>
</html>
