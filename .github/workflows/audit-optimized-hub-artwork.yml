name: Audit immagini ottimizzate Hub
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-optimized-hub-artwork.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux, x64, synology]
    timeout-minutes: 6
    steps:
      - name: Verifica presenza e dimensione dei WebP sul NAS
        shell: bash
        run: |
          set -euo pipefail
          root=/sites/training-dashboard-bog/nas
          ready=0
          for attempt in $(seq 1 25); do
            home_files="$(grep -oE 'data-default-src="/assets/home/[^"]+[.]webp"' "$root/public-index.html" 2>/dev/null | cut -d'"' -f2 || true)"
            car_files="$(grep -oE '/assets/car/[a-z_]+-[a-f0-9]{12}[.]webp' "$root/auto/index.html" 2>/dev/null | sort -u || true)"
            count_home="$(printf '%s\n' "$home_files" | grep -c '^/assets/home/' || true)"
            count_car="$(printf '%s\n' "$car_files" | grep -c '^/assets/car/' || true)"
            if [[ "$count_home" == 5 && "$count_car" == 2 ]]; then
              ready=1
              for asset in $home_files $car_files; do
                [[ -s "$root$asset" ]] || ready=0
                grep -Fq "$asset" "$root/media-manager.html" || ready=0
              done
              [[ "$ready" == 1 ]] && break
            fi
            sleep 6
          done
          [[ "$ready" == 1 ]] || { echo "Ottimizzazione non ancora sincronizzata sul NAS"; exit 1; }
          total_home=0
          total_cars=0
          for asset in $home_files; do
            bytes="$(wc -c < "$root$asset")"
            total_home=$((total_home+bytes))
            echo "$asset: $bytes bytes"
          done
          for asset in $car_files; do
            bytes="$(wc -c < "$root$asset")"
            total_cars=$((total_cars+bytes))
            echo "$asset: $bytes bytes"
          done
          [[ "$total_home" -lt 200000 ]]
          [[ "$total_cars" -lt 750000 ]]
          grep -Fq 'mix-blend-mode:normal!important' "$root/auto/index.html"
          grep -Fq '.preview{background:transparent;' "$root/media-manager.html"
          grep -Fq 'function boot(){apply(document);load()}' "$root/media-client.js"
          echo "NAS_WEBP_SIZES_AND_REFS_OK"

      - name: Verifica che gli asset sul server richiedano sessione
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 6 http://127.0.0.1:8090/assets/home/allenamenti-09da96285aa7.webp)"
          echo "Richiesta anonima WebP: HTTP $code"
          [[ "$code" == 302 ]]
