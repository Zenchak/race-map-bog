name: NAS deploy and verify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: race-map-nas-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy race HUB to Synology
    runs-on: [self-hosted, linux, x64, synology]
    timeout-minutes: 8

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Test HUB dataset before deploy
        shell: bash
        run: |
          set -e
          test "$(grep -oE '"?id"?[[:space:]]*:' extra-races.js | wc -l | tr -d ' ')" -ge 50
          grep -q 'crema-half-2026' extra-races.js
          grep -q 'padenghe-half-2026' extra-races.js
          grep -q 'como-lake-half-2026' extra-races.js
          grep -q 'brescia-art-marathon-2027' extra-races.js
          grep -q 'lanzarote-full-2027' extra-races.js
          grep -q 'id="calendar-view"' app.html
          grep -q 'hub-map-only-style' app.html
          grep -q "BUILD='2026.10.13-0815'" hub-overlay.js
          grep -q 'function render()' hub-overlay.js
          grep -q "document.getElementById('events')" hub-overlay.js
          echo HUB_DATA_SELFTEST_OK

      - name: Show NAS container metadata
        shell: bash
        run: |
          echo "SOCKET:"
          ls -l /var/run/docker.sock || true
          echo "CONTAINERS:"
          curl --silent --unix-socket /var/run/docker.sock http://localhost/containers/json || true

      - name: Deploy and verify on NAS
        shell: bash
        run: bash scripts/nas-deploy.sh "${{ github.sha }}"

      - name: Diagnose legacy HUB DOM
        if: always()
        shell: bash
        run: |
          echo "=== legacy files ==="
          ls -la /sites/race-map-bog/legacy | head -40 || true
          echo "=== legacy CSS/head ==="
          sed -n '1,90p' /sites/race-map-bog/legacy/index.html || true
          echo "=== Gare visibili context ==="
          grep -n -C 8 "Gare visibili" /sites/race-map-bog/legacy/index.html || true
          echo "=== aside/main tags ==="
          grep -nE "<(aside|main)|id=|class=" /sites/race-map-bog/legacy/index.html | head -120 || true


      - name: Verify main Hub files on NAS (read only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking shared /sites mount and Hub deployment"
          test -d /sites/training-dashboard-bog/nas
          test -s /sites/training-dashboard-bog/nas/public-index.html
          test -s /sites/training-dashboard-bog/nas/auto/index.html
          test -s /sites/training-dashboard-bog/nas/media-manager.html
          grep -q 'profileAvatar' /sites/training-dashboard-bog/nas/public-index.html
          grep -q 'hubRefresh' /sites/training-dashboard-bog/nas/public-index.html
          grep -q 'profile-bogdan' /sites/training-dashboard-bog/nas/media-manager.html
          grep -q 'profile-camilla' /sites/training-dashboard-bog/nas/media-manager.html
          code="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/healthz)"
          echo "Main Hub /healthz HTTP $code"
          case "$code" in
            200|204|301|302|303|307|308) echo "Hub disponibile; redirect di autenticazione ammesso" ;;
            *) echo "::error::Hub non raggiungibile: HTTP $code"; exit 1 ;;
          esac
          echo "MAIN_HUB_NAS_VERIFIED"

      - name: Show NAS deployment status
        if: always()
        shell: bash
        run: |
          echo "### NAS deploy status"
          cat /volume1/docker/bogdan-sites/deploy-status-race-map.json || true
