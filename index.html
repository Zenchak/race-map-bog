<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Calendario Gare</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#07111f;color:#f4f8fc}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:520px}.ico{font-size:42px}.title{font-size:22px;font-weight:800;margin:10px 0 6px}.sub{font-size:13px;color:#91a9bf;line-height:1.5}.fallback{display:none;margin-top:16px}.fallback a{display:inline-block;text-decoration:none;background:#67e8f9;color:#06111d;padding:10px 13px;border-radius:12px;font-weight:800}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="box"><div class="ico">🗺️</div><div class="title">Carico la mappa gare…</div><div class="sub">La versione più recente viene letta direttamente da GitHub.</div><div class="fallback" id="fallback"><p class="sub">GitHub non è raggiungibile in questo momento.</p><a href="https://6a9fda04e5e971aba29f9a03--illustrious-cupcake-c1bcb0.netlify.app/">Apri la versione di backup</a></div></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/Zenchak/race-map-bog/main/app.html?ts='+Date.now();
  try{
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.warn('Impossibile caricare app.html da GitHub',err);
    document.getElementById('fallback').style.display='block';
  }
})();
</script>
</body>
</html>
