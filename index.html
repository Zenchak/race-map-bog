<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Calendario Gare</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#loading{height:100%;display:grid;place-items:center;text-align:center}
</style>
</head>
<body>
<div id="loading">Carico Calendario Gare…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./app.html?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').textContent='Errore caricamento HUB: '+e.message;
  }
})();
</script>
</body>
</html>
